<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meowzers' Portfolio</title>
    <style>
        :root {
            --pastel-pink: #ffcce0;
            --pastel-blue: #cce0ff;
            --pastel-yellow: #fff3cc;
            --text-color: #555;
            --bg-color: #fffaf0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        section {
            margin-bottom: 40px;
        }
        .card { 
            background: white; 
            border-radius: 20px; 
            padding: 20px; 
            margin: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: inline-block; 
            width: 300px; 
            border: 2px solid var(--pastel-pink); 
            vertical-align: top; 
            text-align: left; 
        }
        .card img { 
            border-radius: 10px; 
            width: 100%; 
            height: 160px; 
            object-fit: cover; 
            border: none; 
            margin-bottom: 10px; 
        }
        .grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
        }
        h1, h2 { 
            color: #ff99bb; 
        }
        .profile-pic { 
            border-radius: 50%; 
            width: 120px; 
            height: 120px; 
            object-fit: cover; 
            border: 3px solid var(--pastel-blue); 
        }
    </style>
</head>
<body>

    <section id="about">
        <h1>Hi! I'm <span id="username">Meowzers</span></h1>
        <img src="https://cdn.discordapp.com/avatars/269904483235004418/95c3651e2e09909d7af6d5b1351e9a9c.webp?size=1024" alt="Profile Picture" class="profile-pic">
        <div id="skills">
            <h2>My Skills</h2>
            <p>Coding Guru, Luau, Python, Blender, AutoCAD</p>
        </div>
        <div id="contact">
            <h2>Contact</h2>
            <p>Reach out to me on Discord (meowzers1)</p>
        </div>
    </section>

    <section id="creations">
        <h2>My Creations</h2>
        <div class="grid" id="creations-container"></div>
    </section>

    <section id="contributions">
        <h2>My Contributions</h2>
        <div class="grid" id="contributions-container"></div>
    </section>

    <script>
        // Easily add your items here! Just include an 'image' property if you want to show a project screenshot!
        const creations = [
            { 
                title: "Fernwood", 
                description: "A tycoon-style building game built with custom mechanics and building.", 
                image: "https://placehold.co/600x400/ffcce0/555?text=Fernwood" 
            },
            { 
                title: "Cash Frenzy", 
                description: "incremental game", 
                image: "https://placehold.co/600x400/ffcce0/555?text=Cash Frenzy" 
            },
            { 
                title: "Money Mayhem", 
                description: "incremental game", 
                image: "https://placehold.co/600x400/ffcce0/555?text=Cash Frenzy" 
            },
            { 
                title: "A.X.I.U.M", 
                description: "yummy python",
                image: "https://placehold.co/600x400/ffcce0/555?text=A.X.I.U.M" 
            }
        ];

        const contributions = [
            { 
                title: "example", 
                description: "placeholder",
                image: "" 
            },
        ];

        function renderItems(containerId, data) {
            const container = document.getElementById(containerId);
            if (!container) return;
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                let imageHtml = item.image ? `<img src="${item.image}" alt="${item.title}">` : '';
                div.innerHTML = `
                    ${imageHtml}
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                `;
                container.appendChild(div);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderItems('creations-container', creations);
            renderItems('contributions-container', contributions);
        });
    </script>
</body>
</html>
